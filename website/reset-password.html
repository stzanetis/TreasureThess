<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password · TreasureThess</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="site.js"></script>
</head>
<body>
  <header class="site">
    <div class="wrap"><a class="logo" href="index.html"><img src="icon.png" alt="" />TreasureThess</a></div>
  </header>

  <main>
    <section>
      <div class="wrap narrow">
        <h1>Choose a new password</h1>
        <form id="reset-form" class="card">
          <div class="field"><label for="password">New password</label><input id="password" type="password" minlength="6" required autocomplete="new-password" /></div>
          <button class="btn btn-primary" type="submit">Save password</button>
          <div id="status" class="form-status" role="status"></div>
        </form>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/dist/umd/supabase.js"></script>
  <script>
    // Supabase reads the recovery token from the link in the email and signs the user in.
    const client = supabase.createClient(TT_CONFIG.supabaseUrl, TT_CONFIG.supabaseAnonKey);
    const form = document.getElementById('reset-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.className = 'form-status';
      status.textContent = 'Saving…';
      const { error } = await client.auth.updateUser({ password: document.getElementById('password').value });
      if (error) {
        status.className = 'form-status error';
        status.textContent = error.message.includes('session')
          ? 'This link has expired. Request a new one from the app.'
          : error.message;
        return;
      }
      await client.auth.signOut();
      form.innerHTML = '<p><strong>Password updated.</strong> Go back to the TreasureThess app and sign in with your new password.</p>';
    });
  </script>
</body>
</html>
